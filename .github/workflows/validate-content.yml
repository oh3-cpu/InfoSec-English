name: Validate learning content

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content counts and references
        run: node scripts/validate-content-expansion.mjs
      - name: Validate audio inventory without generating MP3
        run: npm run generate:tts -- --dry-run
      - name: Build application
        run: npm run build
