name: Validate learning content

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content counts and references
        run: node scripts/validate-content-expansion.mjs
      - name: Validate audio inventory without generating MP3
        run: npm run generate:tts -- --dry-run
      - name: Validate example translations
        run: node scripts/validate-example-translations.mjs
      - name: Build application
        run: npm run build
      - name: Test audio updates and playback controls
        run: node --test scripts/audio-regression.test.mjs scripts/commute-regression.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test commute playback and offline mode in a mobile viewport
        run: node scripts/commute-browser-check.mjs
